name: Bug report
description: Report a reproducible problem in the public BossAI ecommerce Skill.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, customer credentials, real customer PII or private business datasets.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the user impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction, preferably with synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "1.2.2 or git SHA"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, credentials and real customer PII from this report.
          required: true
